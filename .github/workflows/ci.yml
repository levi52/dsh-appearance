name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: install script regression test (dry run)
        shell: bash
        run: |
          set -euo pipefail
          # --dry-run must print the dsh invocation without executing it.
          node scripts/install.mjs --dry-run > /tmp/install-dry.txt
          grep -q '注册 bundle 到 profile' /tmp/install-dry.txt
          grep -q 'dsh plugin --profile' /tmp/install-dry.txt
          # --skip-add + --dry-run: no real dsh needed, but the script still
          # resolves one — point it at a fake binary.
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nexit 0\n' > /tmp/fakebin/dsh
          chmod +x /tmp/fakebin/dsh
          DSH=/tmp/fakebin/dsh node scripts/install.mjs --dry-run --skip-add > /tmp/install-skip.txt
          grep -q '安装完成' /tmp/install-skip.txt

      - name: uninstall script regression test (dry run)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/uninstall.mjs --dry-run > /tmp/uninstall-dry.txt
          grep -q '从 profile 移除 bundle' /tmp/uninstall-dry.txt
          grep -q 'dsh plugin --profile' /tmp/uninstall-dry.txt
          DSH=/tmp/fakebin/dsh node scripts/uninstall.mjs --dry-run --skip-bundle > /tmp/uninstall-skip.txt
          grep -q '卸载完成' /tmp/uninstall-skip.txt
